{% extends 'Base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<style>
    /* Main content styles */
    .main-content {
        margin-left: 0;
        margin-top: 20px;
        padding: 20px;
        position: relative;
    }
</style>
{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logistics Dashboard</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body>
        <div class="container mt-5">
            <!-- Breadcrumbs -->
            <ol class="breadcrumb mt-2 mb-1">
                <li class="breadcrumb-item d-flex align-items-center">
                    <span class="text-muted">Analytics</span>
                </li>
            </ol>

            <!-- Header -->
            <h1 style="color: #6f42c1">Logistics Dashboard</h1>
            <p>Overview of Logistics Data</p>

                <!-- Pie Chart -->
                <div class="col-md-6 mb-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <canvas id="highestSellingProductChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>

            // Fetch data for Highest Selling Product (Pie Chart)
            fetch('/api/highest-selling-product/')
                .then(response => response.json())
                .then(data => {
                    const pieCtx = document.getElementById('highestSellingProductChart').getContext('2d');
                    new Chart(pieCtx, {
                        type: 'pie',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Highest Selling Products',
                                data: data.data,
                                backgroundColor: [
                                    'rgba(255, 99, 132, 0.2)',
                                    'rgba(54, 162, 235, 0.2)',
                                    'rgba(255, 206, 86, 0.2)',
                                    'rgba(75, 192, 192, 0.2)',
                                    'rgba(153, 102, 255, 0.2)',
                                    'rgba(255, 159, 64, 0.2)',
                                ],
                                borderColor: [
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 206, 86, 1)',
                                    'rgba(75, 192, 192, 1)',
                                    'rgba(153, 102, 255, 1)',
                                    'rgba(255, 159, 64, 1)',
                                ],
                                borderWidth: 1,
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { display: true, position: 'top' },
                                title: { display: true, text: 'Highest Selling Products' },
                            },
                        },
                    });
                });
        </script>

        <!-- Bootstrap JS (Optional for additional interactivity) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
