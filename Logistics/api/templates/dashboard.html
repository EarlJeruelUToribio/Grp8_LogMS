{% extends 'Base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<style>
    /* Main content styles */
    .main-content {
        margin-left: 0;
        margin-top: 20px;
        padding: 20px;
        position: relative;
    }
</style>
{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logistics Dashboard</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>

    <body>
        <div class="container mt-5">
            <!-- Breadcrumbs -->
            <ol class="breadcrumb mt-2 mb-1">
                <li class="breadcrumb-item d-flex align-items-center">
                    <span class="text-muted">Analytics</span>
                </li>
            </ol>
            <!-- Header -->
            <h1 style="color: #6f42c1">Logistics Dashboard</h1>
            <p>Overview of Logistics Data</p>

                <!-- Pie Chart -->
                <div class="col-md-6 mb-4">
                    <div class="card shadow">
                        <div class="card-body">
                            <canvas id="highestSellingProductChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>

            // Fetch data for Highest Selling Product (Pie Chart)
            fetch('/api/highest-selling-product/')
    .then(response => response.json())
    .then(data => {
        const barCtx = document.getElementById('highestSellingProductChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Number of Sales',
                    data: data.data,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1,
                }]
            },
            options: {
                indexAxis: 'y', // Makes it a horizontal bar chart
                responsive: true,
                plugins: {
                    legend: { display: false }, // Hide legend since we have only one dataset
                    title: { display: true, text: 'Highest Selling Products' },
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: { stepSize: 1 }, // Ensures numbers are whole
                        title: { display: true, text: 'Number of Sales' }
                    },
                    y: {
                        title: { display: true, text: 'Products' }
                    }
                }
            },
        });
    });
        </script>

        <!-- Bootstrap JS (Optional for additional interactivity) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
